services:
  web:
    image: nginx
    privileged: true
    network_mode: host
    pid: host
    ipc: host
    userns_mode: host
    user: root
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc:/host-etc:ro
    environment:
      DB_PASSWORD: hunter2
      API_TOKEN: ${API_TOKEN}
  db:
    image: postgres:latest
    ports:
      - "5432:5432"
      - "127.0.0.1:6379:6379"
